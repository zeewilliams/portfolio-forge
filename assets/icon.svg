<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1410"/>
      <stop offset="100%" stop-color="#050805"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#2a4a35" stroke-width="2"/>

  <!-- Scanline subtle texture -->
  <g opacity="0.18">
    <rect x="0" y="60" width="512" height="2" fill="#39ff7a"/>
    <rect x="0" y="140" width="512" height="2" fill="#39ff7a"/>
    <rect x="0" y="220" width="512" height="2" fill="#39ff7a"/>
    <rect x="0" y="300" width="512" height="2" fill="#39ff7a"/>
    <rect x="0" y="380" width="512" height="2" fill="#39ff7a"/>
    <rect x="0" y="460" width="512" height="2" fill="#39ff7a"/>
  </g>

  <!-- Terminal prompt: $_ -->
  <g filter="url(#glow)" fill="#39ff7a" font-family="ui-monospace, monospace" font-weight="700">
    <text x="128" y="320" font-size="220" letter-spacing="-10">$</text>
    <rect x="290" y="240" width="80" height="90" fill="#39ff7a">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
